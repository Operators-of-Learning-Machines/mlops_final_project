name: Unit Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}  # Allows manual executions

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

        # Cache uv + venv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install uv
        run: pip install uv


      - name: Install dependencies
        run: uv sync --group dev

      - name: Run model tests with coverage
        run: |
          uv run coverage run -m pytest tests/test_model.py
          uv run coverage report -m

      - name: Run data tests with coverage
        run: |
          uv run coverage run -m pytest tests/test_data.py
          uv run coverage report -m

      - name: Run api tests with coverage
        run: |
          uv run coverage run -m pytest tests/test_api.py
          uv run coverage report -m
