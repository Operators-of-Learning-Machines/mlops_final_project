[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "sclera_identity_classification"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Operators of Learning Machines", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi==0.115.6",
    "google-cloud-storage>=3.8.0",
    "hydra-core>=1.3.2",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "python-multipart>=0.0.21",
    "pre-commit>=4.5.1",
    "torch==2.9.1+cu128",
    "torcheval>=0.0.7",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "typer==0.15.1",
    "uvicorn==0.34.0",
    "wandb>=0.23.1",
    "markdown>=3.10",
    "streamlit>=1.53.0",
    "httpx>=0.28.1",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "onnxscript>=0.5.7",
    "locust>=2.43.1",
    "prometheus-client>=0.24.1",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "mkdocs-material==9.4.6",
    "mkdocs==1.6.1",
    "pytest==8.3.4",
    "ruff==0.15.1",
    "mkdocstrings-python==1.12.2",
]

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*",
        "/tmp/*",
        "*/_remote_module_non_scriptable.py"
]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:No source for code.*"
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
